<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="720" height="430" fill="#ffffff"/>
  <text x="30" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Multi-source passive aggregation</text>
  <text x="30" y="57" font-size="12.5" fill="#666">DNSsifter queries many free sources concurrently, then layers active discovery and validation on top.</text>

  <!-- source nodes -->
  <g font-size="11.5" font-weight="600">
    <rect x="30" y="80" width="150" height="30" rx="6" fill="#eef3fb" stroke="#3266ad"/><text x="105" y="100" text-anchor="middle" fill="#1b3a66">crt.sh (CT)</text>
    <rect x="30" y="118" width="150" height="30" rx="6" fill="#eef3fb" stroke="#3266ad"/><text x="105" y="138" text-anchor="middle" fill="#1b3a66">Certspotter (CT)</text>
    <rect x="30" y="156" width="150" height="30" rx="6" fill="#eef3fb" stroke="#3266ad"/><text x="105" y="176" text-anchor="middle" fill="#1b3a66">HackerTarget</text>
    <rect x="30" y="194" width="150" height="30" rx="6" fill="#eef3fb" stroke="#3266ad"/><text x="105" y="214" text-anchor="middle" fill="#1b3a66">RapidDNS</text>
    <rect x="30" y="232" width="150" height="30" rx="6" fill="#eef3fb" stroke="#3266ad"/><text x="105" y="252" text-anchor="middle" fill="#1b3a66">URLScan</text>
    <rect x="30" y="270" width="150" height="30" rx="6" fill="#eef3fb" stroke="#3266ad"/><text x="105" y="290" text-anchor="middle" fill="#1b3a66">Wayback / CommonCrawl</text>
    <rect x="30" y="308" width="150" height="30" rx="6" fill="#fef4e2" stroke="#c98500"/><text x="105" y="328" text-anchor="middle" fill="#7a5200">VirusTotal *</text>
  </g>
  <text x="30" y="356" font-size="10" fill="#999">* optional &#8212; API key read from environment (never stored in the repo)</text>

  <!-- connectors to aggregator -->
  <g stroke="#c3c2b7" stroke-width="1.2" fill="none">
    <path d="M180 95 C 250 95, 250 205, 320 205"/>
    <path d="M180 133 C 250 133, 250 205, 320 205"/>
    <path d="M180 171 C 255 171, 255 205, 320 205"/>
    <path d="M180 209 L 320 209"/>
    <path d="M180 247 C 255 247, 255 213, 320 213"/>
    <path d="M180 285 C 250 285, 250 215, 320 215"/>
    <path d="M180 323 C 250 323, 250 217, 320 217"/>
  </g>

  <!-- aggregator -->
  <rect x="320" y="180" width="150" height="60" rx="8" fill="#eef0eb" stroke="#5f5e5a"/>
  <text x="395" y="205" font-size="12.5" text-anchor="middle" fill="#2c2c2a" font-weight="700">Aggregate</text>
  <text x="395" y="223" font-size="10.5" text-anchor="middle" fill="#5f5e5a">dedupe &#183; normalize</text>

  <text x="478" y="214" font-size="18" fill="#888">&#8594;</text>

  <!-- active + validation -->
  <rect x="500" y="150" width="190" height="40" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="595" y="167" font-size="11.5" text-anchor="middle" fill="#04342c" font-weight="700">+ Active brute &amp; recursion</text>
  <text x="595" y="182" font-size="10" text-anchor="middle" fill="#0f6e56">EN / Arabic / Arabizi wordlists</text>

  <rect x="500" y="200" width="190" height="38" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="595" y="217" font-size="11.5" text-anchor="middle" fill="#04342c" font-weight="700">Double-resolver validation</text>
  <text x="595" y="231" font-size="10" text-anchor="middle" fill="#0f6e56">keep only live hosts</text>

  <rect x="500" y="250" width="190" height="40" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
  <text x="595" y="268" font-size="11.5" text-anchor="middle" fill="#173404" font-weight="700">100% live, high-recall set</text>
  <text x="595" y="283" font-size="10" text-anchor="middle" fill="#3b6d11">superset of any single tool</text>
</svg>
