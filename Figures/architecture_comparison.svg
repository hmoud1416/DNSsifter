<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="720" height="600" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#1a1a1a">Why DNSsifter does strictly more than passive aggregators</text>
  <text x="30" y="60" font-size="12.5" fill="#666">Subfinder / Amass / Sublist3r are passive-only. DNSsifter adds three stages they do not have.</text>

  <!-- Passive aggregator -->
  <text x="30" y="98" font-size="15" font-weight="700" fill="#185fa5">Passive aggregator (Subfinder / Amass / Sublist3r)</text>
  <rect x="30" y="110" width="300" height="44" rx="7" fill="#e6f1fb" stroke="#185fa5"/>
  <text x="180" y="130" font-size="12.5" text-anchor="middle" fill="#0c447c" font-weight="600">1 &#183; Query ~38 public databases</text>
  <text x="180" y="146" font-size="10.5" text-anchor="middle" fill="#185fa5">crt.sh, VirusTotal, CT logs, passive DNS &#8230;</text>
  <text x="180" y="172" font-size="16" text-anchor="middle" fill="#888">&#8595;</text>
  <rect x="30" y="178" width="300" height="36" rx="7" fill="#e6f1fb" stroke="#185fa5"/>
  <text x="180" y="201" font-size="12.5" text-anchor="middle" fill="#0c447c" font-weight="600">2 &#183; Union the lists &#8594; output</text>
  <text x="180" y="232" font-size="16" text-anchor="middle" fill="#888">&#8595;</text>
  <rect x="30" y="238" width="300" height="48" rx="7" fill="#fcebeb" stroke="#a32d2d"/>
  <text x="180" y="258" font-size="12.5" text-anchor="middle" fill="#791f1f" font-weight="600">Raw output &#8212; never validated</text>
  <text x="180" y="276" font-size="13" text-anchor="middle" fill="#a32d2d" font-weight="700">~73% dead hosts (precision 0.27)</text>
  <text x="30" y="312" font-size="11.5" fill="#a32d2d">&#10007; no active discovery &#160;&#160; &#10007; no recursion &#160;&#160; &#10007; no liveness validation</text>

  <line x1="30" y1="332" x2="690" y2="332" stroke="#e6e6e6"/>

  <!-- DNSsifter -->
  <text x="30" y="362" font-size="15" font-weight="700" fill="#0f6e56">DNSsifter &#8212; full enumeration engine</text>
  <rect x="30" y="374" width="200" height="48" rx="7" fill="#e6f1fb" stroke="#185fa5"/>
  <text x="130" y="394" font-size="11.5" text-anchor="middle" fill="#0c447c" font-weight="600">1 &#183; Passive aggregation</text>
  <text x="130" y="410" font-size="10" text-anchor="middle" fill="#185fa5">same sources &#8594; parity</text>

  <rect x="260" y="374" width="200" height="48" rx="7" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="360" y="391" font-size="11.5" text-anchor="middle" fill="#04342c" font-weight="600">2 &#183; Active brute-force</text>
  <text x="360" y="406" font-size="10" text-anchor="middle" fill="#0f6e56">EN + Arabic + Arabizi wordlists</text>
  <text x="360" y="417" font-size="9.5" text-anchor="middle" fill="#0f6e56">finds live hosts absent from any CT log</text>

  <rect x="490" y="374" width="200" height="48" rx="7" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="590" y="394" font-size="11.5" text-anchor="middle" fill="#04342c" font-weight="600">3 &#183; Recursive enumeration</text>
  <text x="590" y="410" font-size="10" text-anchor="middle" fill="#0f6e56">multi-level subdomain depth</text>

  <text x="360" y="442" font-size="16" text-anchor="middle" fill="#888">&#8595;</text>
  <rect x="200" y="448" width="320" height="44" rx="7" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="360" y="467" font-size="12.5" text-anchor="middle" fill="#04342c" font-weight="600">4 &#183; Double-resolver validation</text>
  <text x="360" y="483" font-size="10" text-anchor="middle" fill="#0f6e56">Google + Cloudflare + OpenDNS must agree</text>

  <text x="360" y="512" font-size="16" text-anchor="middle" fill="#888">&#8595;</text>
  <rect x="200" y="518" width="320" height="48" rx="7" fill="#eaf3de" stroke="#3b6d11"/>
  <text x="360" y="538" font-size="12.5" text-anchor="middle" fill="#173404" font-weight="700">100% live output + unique active discoveries</text>
  <text x="360" y="555" font-size="10.5" text-anchor="middle" fill="#3b6d11">every reported host resolves &#8212; zero noise</text>
</svg>
