<text x="28" y="440" font-size="12" fill="#5b6168">DNSsifter is the only tool that is simultaneously the most complete (highest recall) and entirely live (precision 1.000).</text>
<text x="28" y="459" font-size="12" fill="#5b6168">Subfinder reports the most raw names but 88% no longer resolve. * Amass v5 needs an API-key datasource config; out-of-the-box it returns almost nothing.</text>
