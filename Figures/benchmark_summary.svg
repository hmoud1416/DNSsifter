<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="720" height="430" fill="#ffffff"/>
  <text x="30" y="36" font-size="19" font-weight="700" fill="#1a1a1a">DNSsifter vs passive tools &#8212; aggregate benchmark</text>
  <text x="30" y="57" font-size="12" fill="#666">Stratified sample, DNS-validated ground truth. Metrics only &#8212; no domain data shown.</text>

  <!-- Precision panel -->
  <text x="30" y="92" font-size="13.5" font-weight="700" fill="#1a1a1a">Precision &#8212; share of results that actually resolve</text>
  <text x="150" y="118" font-size="12" text-anchor="end" fill="#222">DNSsifter</text>
  <rect x="160" y="108" width="500" height="16" rx="3" fill="#1baf7a"/>
  <text x="666" y="121" font-size="11.5" fill="#0f6e56" font-weight="700">1.00</text>
  <text x="150" y="144" font-size="12" text-anchor="end" fill="#222">Subfinder</text>
  <rect x="160" y="134" width="135" height="16" rx="3" fill="#e34948"/>
  <text x="301" y="147" font-size="11.5" fill="#a32d2d" font-weight="700">0.27 &#8212; 73% dead hosts</text>

  <!-- Recall panel -->
  <text x="30" y="184" font-size="13.5" font-weight="700" fill="#1a1a1a">Recall &#8212; journey after the upgrade</text>
  <text x="150" y="210" font-size="12" text-anchor="end" fill="#222">DNSsifter (before)</text>
  <rect x="160" y="200" width="28" height="16" rx="3" fill="#d3d1c7"/>
  <text x="194" y="213" font-size="11.5" fill="#888">0.05</text>
  <text x="150" y="236" font-size="12" text-anchor="end" fill="#222">DNSsifter (after)</text>
  <rect x="160" y="226" width="397" height="16" rx="3" fill="#1baf7a"/>
  <text x="563" y="239" font-size="11.5" fill="#0f6e56" font-weight="700">0.80</text>
  <text x="150" y="262" font-size="12" text-anchor="end" fill="#222">Subfinder</text>
  <rect x="160" y="252" width="442" height="16" rx="3" fill="#2a78d6"/>
  <text x="608" y="265" font-size="11.5" fill="#185fa5" font-weight="700">0.89</text>
  <text x="160" y="286" font-size="10.5" fill="#999">16&#215; improvement &#8212; near parity, while keeping perfect precision.</text>

  <!-- bottom stats -->
  <line x1="30" y1="306" x2="690" y2="306" stroke="#e6e6e6"/>
  <g>
    <rect x="30" y="322" width="200" height="78" rx="10" fill="#eaf3de"/>
    <text x="130" y="356" font-size="30" text-anchor="middle" fill="#173404" font-weight="700">6 / 9</text>
    <text x="130" y="378" font-size="11.5" text-anchor="middle" fill="#3b6d11">decided domains won</text>
    <text x="130" y="393" font-size="10" text-anchor="middle" fill="#3b6d11">(plus 3 ties)</text>

    <rect x="250" y="322" width="200" height="78" rx="10" fill="#e1f5ee"/>
    <text x="350" y="356" font-size="30" text-anchor="middle" fill="#04342c" font-weight="700">326</text>
    <text x="350" y="378" font-size="11.5" text-anchor="middle" fill="#0f6e56">unique live hosts</text>
    <text x="350" y="393" font-size="10" text-anchor="middle" fill="#0f6e56">found by no other tool</text>

    <rect x="470" y="322" width="220" height="78" rx="10" fill="#eef3fb"/>
    <text x="580" y="356" font-size="30" text-anchor="middle" fill="#1b3a66" font-weight="700">100%</text>
    <text x="580" y="378" font-size="11.5" text-anchor="middle" fill="#185fa5">of output is verified live</text>
    <text x="580" y="393" font-size="10" text-anchor="middle" fill="#185fa5">via double-resolver agreement</text>
  </g>
</svg>
